/* ───────── 이름 입력: 순위표에 올릴 영문 이름 ─────────
   휴대폰 자판은 한글로 뜨는 경우가 많아서, 게임 안에 영문 자판을 따로 둠.
   PC에서는 키보드로도 칠 수 있음 (한/영 상태와 상관없이 영문으로 들어감) */
const nameEntry = { active: false, text: '', shift: true, busy: false, field: null, status: null, keys: [] };
const KEY_ROWS = ['qwertyuiop', 'asdfghjkl', ['shift', ...'zxcvbnm', 'back'], ['-', "'", ' ', '.']];
const KEY_LABELS = { shift: '⇧', back: '⌫', ' ': '띄어쓰기' };
const KEY_NAMES = { shift: '대문자', back: '지우기', ' ': '띄어쓰기', '-': '붙임표', "'": '작은따옴표', '.': '마침표' };

const cleanName = (s) =>
  String(s)
    .replace(/[^A-Za-z .'-]/g, '')
    .replace(/\s+/g, ' ')
    .replace(/^[^A-Za-z]+/, '')
    .slice(0, NAME_MAX)
    .trim();
const nameOk = (s) => /^[A-Za-z][A-Za-z .'-]{1,23}$/.test(s) && s.replace(/[^A-Za-z]/g, '').length >= 2;

function buildNamePad() {
  const field = document.createElement('div');
  field.className = 'name-field';
  field.setAttribute('role', 'textbox');
  field.setAttribute('aria-label', '영문 이름');
  const status = note('');
  status.setAttribute('aria-live', 'polite');
  const pad = document.createElement('div');
  pad.className = 'keys';
  nameEntry.keys = [];
  KEY_ROWS.forEach((row, i) => {
    const line = document.createElement('div');
    line.className = i === 1 ? 'key-row inset' : 'key-row';
    for (const k of row) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = k === ' ' ? 'key space' : k.length > 1 || !/[a-z]/.test(k) ? 'key fn' : 'key';
      b.dataset.k = k;
      b.textContent = KEY_LABELS[k] || k;
      if (KEY_NAMES[k]) b.setAttribute('aria-label', KEY_NAMES[k]);
      line.append(b);
      nameEntry.keys.push(b);
    }
    pad.append(line);
  });
  // 누르는 순간 바로 입력 (손을 뗄 때까지 기다리지 않음). 키보드로 누른 경우는 click으로 받음
  pad.addEventListener('pointerdown', (e) => {
    const b = e.target instanceof Element ? e.target.closest('.key') : null;
    if (!b || (e.pointerType === 'mouse' && e.button !== 0)) return;
    e.preventDefault();
    typeName(b.dataset.k);
  });
  pad.addEventListener('click', (e) => {
    const b = e.target instanceof Element ? e.target.closest('.key') : null;
    if (b && e.detail === 0) typeName(b.dataset.k);
  });
  nameEntry.field = field;
  nameEntry.status = status;
  return [field, status, pad];
}

// upper: PC 키보드에서 Shift를 누른 채 친 글자
function typeName(k, upper = false) {
  if (!nameEntry.active || nameEntry.busy) return;
  let t = nameEntry.text;
  const last = t.slice(-1);
  if (k === 'shift') {
    nameEntry.shift = !nameEntry.shift;
    paintName();
    return;
  }
  if (k === 'back') t = t.slice(0, -1);
  else if (t.length >= NAME_MAX) return;
  else if (/^[a-z]$/i.test(k)) t += nameEntry.shift || upper ? k.toUpperCase() : k.toLowerCase();
  else if (k === ' ') t += t && last !== ' ' ? ' ' : '';
  else if (/[A-Za-z]/.test(last)) t += k; // 붙임표 · 따옴표 · 마침표는 글자 바로 뒤에만
  nameEntry.text = t;
  nameEntry.shift = t === '' || /[ -]$/.test(t); // 낱말 첫 글자는 저절로 대문자
  nameEntry.status.textContent = '';
  sound.key();
  paintName();
}

function paintName() {
  const { field, text, shift, busy } = nameEntry;
  const caret = document.createElement('i');
  caret.className = 'caret';
  if (text) {
    field.replaceChildren(text, caret);
  } else {
    const hint = document.createElement('span');
    hint.className = 'hint';
    hint.textContent = '예: Gildong Hong';
    field.replaceChildren(caret, hint);
  }
  for (const b of nameEntry.keys) {
    const k = b.dataset.k;
    if (k.length === 1 && /[a-z]/.test(k)) b.textContent = shift ? k.toUpperCase() : k;
    if (k === 'shift') b.classList.toggle('on', shift);
    b.disabled = busy;
  }
  ui.primary.disabled = busy || !nameOk(cleanName(text));
  ui.secondary.disabled = busy;
}

function showNameEntry() {
  nameEntry.busy = false;
  nameEntry.text = cleanName(store.get(KEY_NAME, ''));
  nameEntry.shift = nameEntry.text === '';
  const cancel = () => showOver();
  showOverlay({
    view: 'name',
    eyebrow: `${fmt(game.score)}점 · 레벨 ${game.level}`,
    title: '이름 입력',
    text: '영문으로 적어 주세요. 순위표에 그대로 보여요.',
    custom: buildNamePad(),
    primary: ['순위표에 올리기', submitName],
    secondary: ['취소', cancel],
    back: cancel,
    wide: true,
  });
  paintName();
}

async function submitName() {
  const name = cleanName(nameEntry.text);
  if (!nameEntry.active || nameEntry.busy || !nameOk(name) || game.submitted) return;
  const entry = { name, score: game.score, level: game.level };
  nameEntry.busy = true;
  nameEntry.status.textContent = '기록을 올리는 중이에요…';
  paintName();
  store.set(KEY_NAME, name);
  try {
    const row = await postScore(entry);
    game.submitted = true;
    ranks.mine = { ...entry, id: row.id, rank: 0 };
    const [, rank] = await Promise.all([loadBoard(true), fetchRank(entry.score).catch(() => 0)]);
    ranks.mine.rank = rank;
    if (ui.overlay.dataset.view === 'name' && game.mode === 'over') showBoard(() => showOver(), true);
  } catch (err) {
    if (ui.overlay.dataset.view !== 'name' || game.mode !== 'over') return;
    if (refused(err)) {
      nameEntry.busy = false;
      nameEntry.status.textContent = '서버가 이 기록을 받아 주지 않았어요. 이름을 확인하고 다시 해 보세요.';
      paintName();
      return;
    }
    game.submitted = true;
    queuePending(entry);
    showOver('인터넷에 연결되지 않아 기록을 보관해 뒀어요. 다음에 연결되면 자동으로 올릴게요.');
  }
}

/* ───────── 그리기 ───────── */
function roundRect(x, y, w, h, r, c = ctx) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

// 벽돌 면의 음영: 위는 밝게, 아래는 어둡게
function makeSheen(c, y, h) {
  const g = c.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, colors.brickLight);
  g.addColorStop(0.5, 'rgba(255, 255, 255, 0)');
  g.addColorStop(0.5, 'rgba(0, 0, 0, 0)');
  g.addColorStop(1, colors.brickShade);
  return g;
}

// 반짝임 (수정 · 금 · 금강석)
function twinkle(c, x, y, phase, t) {
  const a = reduceMotion ? 0.7 : Math.max(0, Math.sin(t * 2.6 + phase * 6.283));
  if (a <= 0.02) return;
  c.globalAlpha = a;
  c.fillStyle = '#ffffff';
  c.fillRect(x - 2.6, y - 0.45, 5.2, 0.9);
  c.fillRect(x - 0.45, y - 2.6, 0.9, 5.2);
  c.globalAlpha = 1;
}

// 돌마다 다른 무늬. d: 0~1 난수 18개(무늬 위치), t: 시각(초)
function drawStoneDeco(c, key, x, y, w, h, d, t) {
  c.save();
  roundRect(x, y, w, h, 1.8, c);
  c.clip();
  switch (key) {
    case 'sand': // 가로로 쌓인 결
      c.fillStyle = 'rgba(120, 78, 30, 0.24)';
      for (let i = 0; i < 3; i++) c.fillRect(x, y + h * (0.24 + i * 0.26) + (d[i] - 0.5) * 1.6, w, 1);
      c.fillStyle = 'rgba(255, 255, 255, 0.3)';
      for (let i = 0; i < 4; i++) c.fillRect(x + d[4 + i] * (w - 2), y + d[8 + i] * (h - 1), 1.4, 1);
      break;
    case 'granite': // 굵은 알갱이
      for (let i = 0; i < 9; i++) {
        c.fillStyle = ['rgba(255, 255, 255, 0.55)', 'rgba(40, 36, 40, 0.5)', 'rgba(200, 120, 120, 0.55)'][i % 3];
        c.fillRect(x + 1 + d[i] * (w - 3.6), y + 1 + d[i + 9] * (h - 3.6), 1.7, 1.7);
      }
      break;
    case 'obsid': { // 유리 같은 광택
      const sx = x + w * (0.1 + d[0] * 0.25);
      c.fillStyle = 'rgba(255, 255, 255, 0.24)';
      c.beginPath();
      c.moveTo(sx, y + h);
      c.lineTo(sx + h * 0.9, y);
      c.lineTo(sx + h * 0.9 + w * 0.13, y);
      c.lineTo(sx + w * 0.13, y + h);
      c.closePath();
      c.fill();
      c.fillStyle = 'rgba(170, 140, 255, 0.3)';
      c.fillRect(x, y + h - 3, w, 3);
      break;
    }
    case 'blast': { // 위험 띠와 깜빡이는 불씨
      const top = y + h * 0.3;
      const bh = h * 0.42;
      c.fillStyle = colors.safety;
      c.fillRect(x, top, w, bh);
      c.fillStyle = colors.cap;
      for (let sx = x - bh; sx < x + w + bh; sx += 9) {
        c.beginPath();
        c.moveTo(sx, top + bh);
        c.lineTo(sx + 4.5, top + bh);
        c.lineTo(sx + 4.5 + bh, top);
        c.lineTo(sx + bh, top);
        c.closePath();
        c.fill();
      }
      c.fillStyle = colors.bad;
      c.globalAlpha = reduceMotion ? 1 : 0.55 + 0.45 * Math.sin(t * 7 + d[0] * 6);
      c.beginPath();
      c.arc(x + w / 2, y + h * 0.16, 1.5, 0, Math.PI * 2);
      c.fill();
      c.globalAlpha = 1;
      break;
    }
    case 'lode': // 막대자석: 빨간 극과 파란 극
      c.fillStyle = colors.bad;
      c.fillRect(x, y, w * 0.3, h);
      c.fillStyle = colors.poleS;
      c.fillRect(x + w * 0.7, y, w * 0.3, h);
      break;
    case 'jade': // 물결 무늬
      c.lineWidth = 1.6;
      c.strokeStyle = 'rgba(255, 255, 255, 0.32)';
      c.beginPath();
      c.moveTo(x - 2, y + h * (0.3 + d[0] * 0.4));
      c.bezierCurveTo(x + w * 0.3, y - h * 0.3, x + w * 0.6, y + h * 1.3, x + w + 2, y + h * (0.3 + d[1] * 0.4));
      c.stroke();
      c.lineWidth = 1;
      c.strokeStyle = 'rgba(8, 60, 40, 0.35)';
      c.beginPath();
      c.moveTo(x - 2, y + h * (0.55 + d[2] * 0.3));
      c.bezierCurveTo(x + w * 0.35, y + h * 0.1, x + w * 0.7, y + h * 1.4, x + w + 2, y + h * (0.5 + d[3] * 0.3));
      c.stroke();
      break;
    case 'marble': // 회색 결
      c.strokeStyle = 'rgba(88, 94, 108, 0.55)';
      c.lineWidth = 0.9;
      for (let i = 0; i < 2; i++) {
        let px = x + w * (0.12 + d[i] * 0.3 + i * 0.42);
        c.beginPath();
        c.moveTo(px, y);
        for (let j = 1; j <= 3; j++) {
          px += (d[2 + i * 3 + j] - 0.35) * 9;
          c.lineTo(px, y + (h * j) / 3);
        }
        c.stroke();
      }
      break;
    case 'quartz': { // 뾰족한 결정
      const n = Math.max(2, Math.round(w / 13));
      c.strokeStyle = 'rgba(255, 255, 255, 0.6)';
      c.lineWidth = 0.9;
      c.beginPath();
      c.moveTo(x, y + h);
      for (let i = 1; i <= n; i++) {
        const px = x + (w * i) / n;
        c.lineTo(px - w / n / 2, y + 2.5);
        c.lineTo(px, y + h);
      }
      c.stroke();
      twinkle(c, x + w * (0.2 + d[0] * 0.6), y + h * 0.42, d[1], t);
      break;
    }
    case 'amber': { // 속이 비치는 빛과 갇힌 알갱이
      const g = c.createRadialGradient(x + w * 0.3, y + h * 0.3, 0, x + w * 0.3, y + h * 0.3, w * 0.6);
      g.addColorStop(0, 'rgba(255, 244, 180, 0.65)');
      g.addColorStop(1, 'rgba(255, 244, 180, 0)');
      c.fillStyle = g;
      c.fillRect(x, y, w, h);
      c.fillStyle = 'rgba(92, 40, 0, 0.6)';
      c.beginPath();
      c.ellipse(x + w * (0.45 + d[0] * 0.35), y + h * 0.56, 2.4, 1.4, d[1] * 3, 0, Math.PI * 2);
      c.fill();
      break;
    }
    case 'gold': // 박혀 있는 금 알갱이
      c.fillStyle = colors.gold;
      for (let i = 0; i < 7; i++) {
        const s = i < 2 ? 2.7 : 1.4;
        c.fillRect(x + 1.5 + d[i] * (w - 4.5), y + 1.5 + d[i + 7] * (h - 4.5), s, s);
      }
      twinkle(c, x + 2.8 + d[0] * (w - 4.5), y + 2.8 + d[7] * (h - 4.5), d[14], t);
      break;
    case 'meteor': // 움푹 팬 구덩이
      for (let i = 0; i < 3; i++) {
        const cx = x + w * (0.18 + i * 0.32 + (d[i] - 0.5) * 0.12);
        const cy = y + h * (0.32 + d[i + 3] * 0.36);
        const r = 1.8 + d[i + 6] * 1.5;
        c.fillStyle = 'rgba(0, 0, 0, 0.42)';
        c.beginPath();
        c.arc(cx, cy, r, 0, Math.PI * 2);
        c.fill();
        c.strokeStyle = 'rgba(255, 200, 160, 0.45)';
        c.lineWidth = 0.8;
        c.beginPath();
        c.arc(cx, cy, r, Math.PI * 0.1, Math.PI * 0.9);
        c.stroke();
      }
      break;
    case 'diamond': { // 깎은 면
      const n = Math.max(2, Math.round(w / 12));
      c.fillStyle = 'rgba(60, 140, 220, 0.2)';
      c.fillRect(x, y + h * 0.5, w, h * 0.5);
      c.strokeStyle = 'rgba(255, 255, 255, 0.85)';
      c.lineWidth = 0.8;
      c.beginPath();
      for (let i = 0; i < n; i++) {
        const a = x + (w * i) / n;
        const b = x + (w * (i + 1)) / n;
        c.moveTo(a, y);
        c.lineTo(b, y + h);
        c.moveTo(b, y);
        c.lineTo(a, y + h);
      }
      c.stroke();
      twinkle(c, x + w * (0.2 + d[0] * 0.6), y + h * 0.35, d[1], t);
      break;
    }
    default:
      break;
  }
  c.restore();
}

// 돌 한 장 (벽 · 레벨 안내 딱지 · 돌 도감에서 함께 씀)
function drawStoneFace(c, s, x, y, w, h, d, t, sheen = null) {
  roundRect(x, y, w, h, 1.8, c);
  c.fillStyle = colors.stone[s.key];
  c.fill();
  drawStoneDeco(c, s.key, x, y, w, h, d, t);
  roundRect(x, y, w, h, 1.8, c);
  c.fillStyle = sheen || makeSheen(c, y, h);
  c.fill();
  c.fillStyle = colors.brickLight;
  c.fillRect(x + 1.5, y + 0.7, w - 3, 1);
}

// 자철석이 끌어당기는 범위: 돌 쪽으로 좁혀 드는 고리로 보여 줌
function drawPull(t) {
  ctx.strokeStyle = colors.poleS;
  ctx.lineWidth = 1.2;
  for (const k of game.lodes) {
    if (!k.alive) continue;
    for (let i = 0; i < 3; i++) {
      const f = reduceMotion ? (i + 1) / 3 : 1 - ((t * 0.45 + i / 3) % 1);
      ctx.globalAlpha = 0.34 * f;
      ctx.beginPath();
      ctx.arc(k.x + k.w / 2, k.y + k.h / 2, 12 + (PULL_R - 12) * f, 0, Math.PI * 2);
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
}

function drawWall(t) {
  // 줄눈: 남아 있는 벽돌 둘레에만 칠해서, 깨진 자리는 구멍으로 보이게
  const m = JOINT / 2 + 0.4;
  // 벽 아래로 떨어지는 옅은 그림자: 벽이 바탕에서 살짝 떠 보이게
  ctx.fillStyle = colors.wallShadow;
  for (const k of bricks) {
    if (k.alive) ctx.fillRect(k.x - m, k.y - m + 4, k.w + m * 2, k.h + m * 2);
  }
  ctx.fillStyle = colors.mortar;
  for (const k of bricks) {
    if (k.alive) ctx.fillRect(k.x - m, k.y - m, k.w + m * 2, k.h + m * 2);
  }
  // 벽돌 면의 음영은 같은 켜끼리 한 번만 만들어 함께 씀
  const sheens = new Map();
  for (const k of bricks) {
    if (!k.alive) continue;
    let sheen = sheens.get(k.y);
    if (!sheen) {
      sheen = makeSheen(ctx, k.y, k.h);
      sheens.set(k.y, sheen);
    }
    if (k.kind) {
      drawStoneFace(ctx, k.kind, k.x, k.y, k.w, k.h, k.deco, t, sheen);
    } else {
      roundRect(k.x, k.y, k.w, k.h, 1.8);
      ctx.fillStyle = brickColor(k);
      ctx.fill();
      ctx.fillStyle = sheen;
      ctx.fill();
      ctx.fillStyle = colors.brickLight;
      ctx.fillRect(k.x + 1.5, k.y + 0.7, k.w - 3, 1);
    }
    if (k.specks) {
      ctx.fillStyle = colors.speck;
      for (const [sx, sy] of k.specks) ctx.fillRect(sx, sy, 1.5, 1.5);
    }
    const damage = k.maxHp - k.hp;
    if (damage > 0 && k.cracks) {
      // 돌은 깨질 때까지 금이 고르게 늘어남 (여덟 번 맞는 돌도 금은 네 줄까지)
      const shown = k.kind ? Math.ceil((damage * k.cracks.length) / (k.maxHp - 1)) : damage;
      const light = k.kind ? k.kind.dark : k.maxHp === 2;
      ctx.strokeStyle = light ? colors.crackLight : colors.crackDark;
      ctx.lineWidth = 1.2;
      ctx.lineJoin = 'round';
      for (let i = 0; i < shown && i < k.cracks.length; i++) {
        const c = k.cracks[i];
        ctx.beginPath();
        ctx.moveTo(c[0][0], c[0][1]);
        for (let j = 1; j < c.length; j++) ctx.lineTo(c[j][0], c[j][1]);
        ctx.stroke();
      }
    }
    if (k.flash > 0) {
      ctx.globalAlpha = k.flash * 0.55;
      ctx.fillStyle = colors.flash;
      ctx.fillRect(k.x, k.y, k.w, k.h);
      ctx.globalAlpha = 1;
    }
  }
}

function drawParticles() {
  for (const p of particles) {
    const f = clamp(p.life / p.max, 0, 1);
    if (p.ring) {
      // 벽돌이 깨진 자리에서 퍼지는 충격 고리
      ctx.globalAlpha = (1 - f) * 0.5;
      ctx.strokeStyle = p.color;
      ctx.lineWidth = (p.big ? 5 : 2.2) * (1 - f) + 0.4;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 5 + f * (p.big ? 50 : 22), 0, Math.PI * 2);
      ctx.stroke();
      continue;
    }
    if (p.text) {
      ctx.globalAlpha = Math.min(1, (1 - f) * 2.5);
      ctx.font = `700 14px ${fonts.body}`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 3;
      ctx.lineJoin = 'round';
      ctx.strokeStyle = colors.field;
      ctx.strokeText(p.text, p.x, p.y);
      ctx.fillStyle = p.color;
      ctx.fillText(p.text, p.x, p.y);
      continue;
    }
    ctx.globalAlpha = 1 - f * f;
    ctx.fillStyle = p.color;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillRect(-p.size / 2, -p.size * 0.35, p.size, p.size * 0.7);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawHazard() {
  // 바닥의 노랑·검정 위험 띠: 공이 여기로 떨어지면 하나를 잃음
  const band = 6;
  const top = H - band;
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, top, W, band);
  ctx.clip();
  ctx.fillStyle = colors.safety;
  ctx.fillRect(0, top, W, band);
  ctx.fillStyle = colors.cap;
  for (let x = -band; x < W + band; x += 16) {
    ctx.beginPath();
    ctx.moveTo(x, H);
    ctx.lineTo(x + 8, H);
    ctx.lineTo(x + 8 + band, top);
    ctx.lineTo(x + band, top);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

function drawPaddle() {
  // 수평계 모양 패들: 움직이면 가운데 기포가 출렁임
  const { w, h, y } = paddle;
  const x = paddle.x - w / 2;
  ctx.fillStyle = colors.wallShadow;
  roundRect(x + 1, y + 4, w - 2, h, 4);
  ctx.fill();
  const body = ctx.createLinearGradient(0, y, 0, y + h);
  body.addColorStop(0, colors.safety);
  body.addColorStop(1, colors.safetyDeep);
  ctx.fillStyle = body;
  roundRect(x, y, w, h, 4);
  ctx.fill();
  ctx.fillStyle = colors.cap;
  roundRect(x, y, 8, h, 4);
  ctx.fill();
  roundRect(x + w - 8, y, 8, h, 4);
  ctx.fill();
  ctx.fillStyle = colors.shine;
  ctx.globalAlpha = 0.5;
  ctx.fillRect(x + 10, y + 1.2, w - 20, 1.2);
  ctx.globalAlpha = 1;
  const vw = 26;
  const vh = 7;
  const vx = paddle.x - vw / 2;
  const vy = y + (h - vh) / 2;
  ctx.fillStyle = colors.vial;
  roundRect(vx, vy, vw, vh, vh / 2);
  ctx.fill();
  ctx.fillStyle = colors.bubble;
  ctx.beginPath();
  ctx.ellipse(paddle.x + paddle.bubble, vy + vh / 2, 4.6, 2.3, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = colors.cap;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(paddle.x - 6.5, vy + 0.5);
  ctx.lineTo(paddle.x - 6.5, vy + vh - 0.5);
  ctx.moveTo(paddle.x + 6.5, vy + 0.5);
  ctx.lineTo(paddle.x + 6.5, vy + vh - 0.5);
  ctx.stroke();
}

function drawBall() {
  if (!reduceMotion && !ball.stuck) {
    const n = ball.trail.length;
    ball.trail.forEach((p, i) => {
      const f = (i + 1) / (n + 1);
      ctx.globalAlpha = f * f * 0.2;
      ctx.fillStyle = colors.steel;
      ctx.beginPath();
      ctx.arc(p.x, p.y, ball.r * (0.3 + 0.65 * f), 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
  }
  // 쇠공: 왼쪽 위에서 빛을 받는 구슬처럼
  const g = ctx.createRadialGradient(ball.x - 2.4, ball.y - 2.6, 0.4, ball.x, ball.y, ball.r);
  g.addColorStop(0, colors.shine);
  g.addColorStop(0.4, colors.steel);
  g.addColorStop(1, colors.steelDeep);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fill();
}

function drawBanner() {
  const b = game.banner;
  const alpha = clamp(Math.min(b.t / 0.18, (b.dur - b.t) / 0.45), 0, 1);
  const y = Math.max(game.wallBottom + 80, H * 0.52);
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  if (b.kicker) {
    ctx.fillStyle = colors.muted;
    ctx.font = `700 14px ${fonts.body}`;
    ctx.fillText(b.kicker, W / 2, y - (b.badge ? 74 : 40));
  }
  if (b.badge) {
    // 난이도가 오르거나 새 돌이 나오는 레벨: 안전 노랑 딱지로 알림 (새 돌이면 그 돌도 함께)
    ctx.font = `700 14px ${fonts.body}`;
    const sw = b.stone ? 36 : 0;
    const bw = ctx.measureText(b.badge).width + 24 + sw;
    ctx.fillStyle = colors.safety;
    roundRect(W / 2 - bw / 2, y - 56, bw, 26, 13);
    ctx.fill();
    if (b.stone) {
      ctx.fillStyle = colors.mortar;
      ctx.fillRect(W / 2 - bw / 2 + 9, y - 50, 32, 14);
      drawStoneFace(ctx, b.stone, W / 2 - bw / 2 + 10.5, y - 48.5, 29, 11, SAMPLE_DECO, performance.now() / 1000);
    }
    ctx.fillStyle = colors.safetyInk;
    ctx.fillText(b.badge, W / 2 + sw / 2, y - 42.5);
  }
  ctx.fillStyle = colors.ink;
  ctx.font = `400 38px ${fonts.display}`;
  ctx.fillText(b.title, W / 2, y);
  if (b.sub) {
    ctx.font = `600 17px ${fonts.body}`;
    ctx.fillText(b.sub, W / 2, y + 36);
  }
  if (b.tip) {
    ctx.fillStyle = colors.muted;
    ctx.font = `400 15px ${fonts.body}`;
    ctx.fillText(b.tip, W / 2, y + 62);
  }
  ctx.restore();
}

function drawHint() {
  const pulse = reduceMotion ? 0.85 : 0.6 + 0.3 * Math.sin(performance.now() / 260);
  ctx.save();
  ctx.globalAlpha = pulse;
  ctx.fillStyle = colors.muted;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `600 15px ${fonts.body}`;
  ctx.fillText(game.touchUI ? '탭하면 발사' : '클릭 또는 스페이스로 발사', W / 2, paddle.y - 42);
  ctx.restore();
}

// 순위표 1위 기록: 경기장 맨 위에 작게
function drawTopScore() {
  const top = ranks.rows[0];
  if (!top) return;
  ctx.save();
  ctx.globalAlpha = 0.8;
  ctx.fillStyle = colors.muted;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `600 12px ${fonts.body}`;
  ctx.fillText(`1위 ${fmt(top.score)}점 · ${top.name}`, W / 2, 22, W - 24);
  ctx.restore();
}

// 데모 중의 순위표 전광판: 주식 시세판처럼 오른쪽에서 왼쪽으로 흐름
function drawTicker() {
  const y = 8;
  const h = 28;
  const white = colors.bubble;
  const dim = 'rgba(255, 255, 255, 0.55)';
  const parts = [['순위표', colors.safety], ['  ◆  ', dim]];
  if (ranks.rows.length) {
    ranks.rows.forEach((r, i) => {
      parts.push([`${i + 1}위 `, colors.safety], [`${r.name} `, white], [`▲ ${fmt(r.score)}점 `, colors.good], [`레벨 ${r.level}`, dim], ['  ◆  ', dim]);
    });
  } else {
    parts.push([boardOn() ? '아직 기록이 없어요. 첫 기록을 남겨 보세요' : '순위표 준비 중이에요', white], ['  ◆  ', dim]);
  }
  ctx.save();
  ctx.fillStyle = colors.cap;
  roundRect(8, y, W - 16, h, 7);
  ctx.fill();
  ctx.beginPath();
  ctx.rect(14, y, W - 28, h);
  ctx.clip();
  ctx.font = `700 13px ${fonts.body}`;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  const widths = parts.map(([text]) => ctx.measureText(text).width);
  const total = widths.reduce((a, b) => a + b, 0);
  // 한 바퀴가 끝나면 바로 이어지도록 같은 줄을 화면이 찰 때까지 되풀이해 그림
  let x = 14 - ((reduceMotion ? 0 : game.demoT * 46) % total);
  while (x < W) {
    parts.forEach(([text, color], i) => {
      if (x + widths[i] > 0 && x < W) {
        ctx.fillStyle = color;
        ctx.fillText(text, x, y + h / 2 + 0.5);
      }
      x += widths[i];
    });
  }
  ctx.restore();
}

function drawDemoHint() {
  const pulse = reduceMotion ? 0.9 : 0.62 + 0.3 * Math.sin(performance.now() / 320);
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.globalAlpha = pulse;
  ctx.fillStyle = colors.ink;
  ctx.font = `400 26px ${fonts.display}`;
  ctx.fillText('데모 화면', W / 2, paddle.y - 92);
  ctx.fillStyle = colors.muted;
  ctx.font = `600 15px ${fonts.body}`;
  ctx.fillText(game.touchUI ? '화면을 누르면 시작해요' : '아무 키나 누르면 시작해요', W / 2, paddle.y - 62);
  ctx.restore();
}

// 켜져 있는 효과: 패들 아래에 이름과 남은 시간 막대
function drawFx() {
  const active = Object.keys(fx).filter((name) => fx[name] > 0);
  if (!active.length) return;
  ctx.save();
  ctx.font = `700 11px ${fonts.body}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const widths = active.map((name) => ctx.measureText(FX[name].label).width + 18);
  let x = W / 2 - (widths.reduce((a, b) => a + b, 0) + (active.length - 1) * 6) / 2;
  const y = H - 36;
  active.forEach((name, i) => {
    const w = widths[i];
    // 끝나기 2초 전부터 깜빡임
    ctx.globalAlpha = fx[name] < 2 && !reduceMotion && Math.floor(fx[name] * 6) % 2 === 0 ? 0.45 : 0.92;
    ctx.fillStyle = colors.ink;
    roundRect(x, y, w, 19, 6);
    ctx.fill();
    ctx.fillStyle = colors.field;
    ctx.fillText(FX[name].label, x + w / 2, y + 8.5);
    ctx.fillStyle = FX[name].good ? colors.good : colors.bad;
    ctx.fillRect(x + 5, y + 15.2, (w - 10) * clamp(fx[name] / fxFull[name], 0, 1), 2);
    x += w + 6;
  });
  ctx.restore();
}

function render() {
  if (!canvas.width || !canvas.height) return;
  const t = performance.now() / 1000;
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, colors.field);
  bg.addColorStop(1, colors.field2);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);
  if (game.shake > 0 && !reduceMotion) {
    // 폭발: 화면을 잠깐 흔듦
    const amp = 5 * (game.shake / 0.3);
    ctx.translate((Math.random() - 0.5) * amp, (Math.random() - 0.5) * amp);
  }
  if (game.demo) drawTicker();
  else drawTopScore();
  drawPull(t);
  drawWall(t);
  drawParticles();
  drawHazard();
  drawFx();
  drawPaddle();
  if (game.mode !== 'over') drawBall();
  if (game.demo) drawDemoHint();
  else if (game.banner) drawBanner();
  else if (game.mode === 'ready') drawHint();
}

/* ───────── 매 프레임 ───────── */
function update(dt) {
  if (game.mode === 'paused' || game.mode === 'menu') return;
  if (game.mode === 'ready' || game.mode === 'playing') {
    if (game.demo) demoStep(dt);
    if (keys.left) paddle.target -= KEY_SPEED * dt;
    if (keys.right) paddle.target += KEY_SPEED * dt;
    // 패들 길이: 옥을 깨면 한동안 길어졌다가 부드럽게 돌아옴
    const wantW = paddle.baseW * (fx.wide > 0 ? 1.45 : 1);
    paddle.w += (wantW - paddle.w) * Math.min(1, dt * 10);
    if (Math.abs(wantW - paddle.w) < 0.3) paddle.w = wantW;
    paddle.target = clamp(paddle.target, paddle.w / 2, W - paddle.w / 2);
    const prev = paddle.x;
    paddle.x = paddle.target;
    const v = dt > 0 ? (paddle.x - prev) / dt : 0;
    paddle.vx += (v - paddle.vx) * Math.min(1, dt * 12);
    const bubbleTarget = clamp(-paddle.vx * 0.012, -7, 7);
    paddle.bubble += (bubbleTarget - paddle.bubble) * Math.min(1, dt * 8);
  }
  if (game.mode === 'ready') placeOnPaddle();
  if (game.shake > 0) game.shake = Math.max(0, game.shake - dt);
  if (game.mode === 'playing') {
    tickFx(dt);
    game.acc += dt;
    while (game.acc >= STEP && game.mode === 'playing') {
      stepBall(STEP);
      game.acc -= STEP;
    }
    if (game.mode === 'playing') {
      ball.trail.push({ x: ball.x, y: ball.y });
      if (ball.trail.length > 10) ball.trail.shift();
    }
  }
  updateParticles(dt);
  for (const k of bricks) if (k.flash > 0) k.flash = Math.max(0, k.flash - dt * 6);
  if (game.banner) {
    game.banner.t += dt;
    if (game.banner.t >= game.banner.dur) game.banner = null;
  }
}

let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now;
  // 시작 화면(또는 더 할 일이 없는 게임 오버 화면)을 그대로 두면 데모로
  const view = ui.overlay.dataset.view;
  if (!game.demo && !ui.overlay.hidden) {
    const idle = now - lastInput;
    if (game.mode === 'menu' && view === 'menu' && idle > DEMO_WAIT) startDemo();
    else if (game.mode === 'over' && view === '' && idle > 20000 && (game.submitted || game.score === 0 || !boardOn())) showMenu();
  }
  update(dt);
  const active = game.mode === 'ready' || game.mode === 'playing' || particles.length > 0;
  if (active || needsRender) {
    render();
    needsRender = false;
  }
}

/* ───────── 입력: 터치 · 마우스 · 키보드 ───────── */
function pointerX(clientX) {
  const r = canvas.getBoundingClientRect();
  return r.width > 0 ? ((clientX - r.left) / r.width) * W : paddle.target;
}
const isControl = (t) => t instanceof Element && t.closest('.hud, .overlay') !== null;
const inPlay = () => !game.demo && (game.mode === 'ready' || game.mode === 'playing');

app.addEventListener('pointerdown', (e) => {
  lastKeyboard = false;
  lastInput = performance.now();
  if (game.demo) {
    // 데모 중에 화면을 누르면 시작 화면으로
    e.preventDefault();
    sound.unlock();
    showMenu();
    return;
  }
  if (isControl(e.target)) return;
  sound.unlock();
  game.touchUI = e.pointerType !== 'mouse';
  if (!inPlay()) return;
  e.preventDefault();
  try {
    app.setPointerCapture(e.pointerId);
  } catch (err) {
    /* 캡처 불가: 무시 */
  }
  paddle.target = pointerX(e.clientX);
  if (game.mode === 'ready') game.armed = true;
});

app.addEventListener('pointermove', (e) => {
  if (!inPlay()) return;
  const pressed = app.hasPointerCapture && app.hasPointerCapture(e.pointerId);
  if (e.pointerType === 'mouse' || pressed) paddle.target = pointerX(e.clientX);
});

function endPointer(e, cancelled) {
  if (app.hasPointerCapture && app.hasPointerCapture(e.pointerId)) app.releasePointerCapture(e.pointerId);
  if (!cancelled && game.mode === 'ready' && game.armed) launch();
  game.armed = false;
}
app.addEventListener('pointerup', (e) => endPointer(e, false));
app.addEventListener('pointercancel', (e) => endPointer(e, true));
app.addEventListener('contextmenu', (e) => e.preventDefault());

// 이름 입력 중의 키보드: 글자 위치(e.code)로 읽어서 한글 자판 상태여도 영문으로 들어감
function nameKey(e) {
  if (e.ctrlKey || e.metaKey || e.altKey || e.code === 'Tab') return;
  const onButton = document.activeElement instanceof HTMLButtonElement;
  const punct = { Minus: '-', Quote: "'", Period: '.', NumpadSubtract: '-', NumpadDecimal: '.' };
  if (/^Key[A-Z]$/.test(e.code)) typeName(e.code.slice(3).toLowerCase(), e.shiftKey);
  else if (e.code === 'Space' && !onButton) typeName(' ');
  else if (e.code === 'Backspace') typeName('back');
  else if (punct[e.code] && !e.shiftKey) typeName(punct[e.code]);
  else if ((e.code === 'Enter' || e.code === 'NumpadEnter') && !onButton) submitName();
  else if (e.code === 'Escape' && overlayActions.back && !nameEntry.busy) overlayActions.back();
  else return;
  e.preventDefault();
}

window.addEventListener('keydown', (e) => {
  lastKeyboard = true;
  lastInput = performance.now();
  sound.unlock();
  if (game.demo) {
    e.preventDefault();
    showMenu();
    return;
  }
  if (nameEntry.active) {
    nameKey(e);
    return;
  }
  if (e.code === 'Escape' && overlayActions.back && !ui.overlay.hidden) {
    overlayActions.back();
    return;
  }
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
    keys.left = true;
    e.preventDefault();
  } else if (e.code === 'ArrowRight' || e.code === 'KeyD') {
    keys.right = true;
    e.preventDefault();
  } else if (e.code === 'Space' || e.code === 'Enter' || e.code === 'NumpadEnter') {
    if (!ui.overlay.hidden) {
      // 안내판이 떠 있으면 버튼에 포커스가 없을 때만 주 버튼 실행
      if (!(document.activeElement instanceof HTMLButtonElement)) {
        e.preventDefault();
        if (overlayActions.primary) overlayActions.primary();
      }
      return;
    }
    e.preventDefault();
    if (game.mode === 'ready') launch();
  } else if (e.code === 'KeyP' || e.code === 'Escape') {
    if (game.mode === 'paused') resume();
    else pause();
  }
});

window.addEventListener('keyup', (e) => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
});

ui.primary.addEventListener('click', () => {
  if (overlayActions.primary) overlayActions.primary();
});
ui.secondary.addEventListener('click', () => {
  if (overlayActions.secondary) overlayActions.secondary();
});
ui.pause.addEventListener('click', () => pause());
ui.sound.addEventListener('click', () => {
  sound.muted = !sound.muted;
  store.set(KEY_MUTED, sound.muted ? '1' : '0');
  if (!sound.muted) {
    sound.unlock();
    sound.wall();
  }
  updateSoundButton();
  if (!lastKeyboard) ui.sound.blur();
});

function setupFullscreen() {
  const el = document.documentElement;
  // 홈 화면에 설치한 앱으로 열었으면 이미 전체 화면이라 버튼을 숨김
  const installed = matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches;
  const canFull = !installed && !!(document.fullscreenEnabled || document.webkitFullscreenEnabled) && !!(el.requestFullscreen || el.webkitRequestFullscreen);
  ui.full.hidden = !canFull;
  if (!canFull) return;
  const sync = () => {
    const on = !!(document.fullscreenElement || document.webkitFullscreenElement);
    ui.full.innerHTML = on ? ICONS.exitFull : ICONS.full;
    ui.full.setAttribute('aria-label', on ? '전체 화면 끝내기' : '전체 화면');
  };
  sync();
  document.addEventListener('fullscreenchange', sync);
  document.addEventListener('webkitfullscreenchange', sync);
  ui.full.addEventListener('click', async () => {
    try {
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        if (document.exitFullscreen) await document.exitFullscreen();
        else document.webkitExitFullscreen();
      } else {
        if (el.requestFullscreen) await el.requestFullscreen({ navigationUI: 'hide' });
        else el.webkitRequestFullscreen();
        try {
          await screen.orientation.lock('portrait');
        } catch (err) {
          /* 화면 방향 고정 미지원 */
        }
      }
    } catch (err) {
      /* 전체 화면이 거부되면 그대로 진행 */
    }
    if (!lastKeyboard) ui.full.blur();
  });
}

// 다른 앱으로 전환하면 자동 일시정지
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) return;
  if (game.mode === 'playing') pause();
  saveBest();
});
window.addEventListener('blur', () => {
  keys.left = false;
  keys.right = false;
  if (game.mode === 'playing') pause();
});
window.addEventListener('pagehide', saveBest);

/* ───────── 페이지를 새로 고치지 않고 갱신될 때 진행 상황 이어가기 ───────── */
function snapshot() {
  return {
    v: 2,
    mode: game.demo ? 'menu' : game.mode === 'paused' ? game.resumeMode : game.mode,
    score: game.score,
    level: game.level,
    lives: game.lives,
    startBest: game.startBest,
    hp: bricks.map((k) => (k.alive ? k.hp : 0)),
  };
}

function restore(saved) {
  if (!saved || saved.v !== 2) return false;
  if (saved.mode !== 'ready' && saved.mode !== 'playing') return false;
  game.score = saved.score | 0;
  game.level = Math.max(1, saved.level | 0);
  game.lives = clamp(saved.lives | 0, 1, 9);
  game.startBest = saved.startBest | 0;
  buildLevel(game.level);
  if (Array.isArray(saved.hp) && saved.hp.length === bricks.length) {
    bricks.forEach((k, i) => {
      const hp = saved.hp[i] | 0;
      if (hp <= 0) k.alive = false;
      else k.hp = Math.min(hp, k.maxHp);
    });
    game.remaining = bricks.filter((k) => k.alive).length;
    if (game.remaining === 0) buildLevel(game.level);
  }
  resetBall();
  game.mode = 'ready';
  updateHud();
  pause();
  return true;
}

/* ───────── 시작 ───────── */
function start(saved) {
  readPalette();
  watchTheme();
  updateSoundButton();
  setupFullscreen();
  buildLevel(1);
  layout();
  resetBall();
  updateHud();
  // 순위표: 지난번에 받아 둔 것을 먼저 보여 주고, 새로 받아 오면 시작 화면의 1위도 고침
  const cached = readJson(KEY_BOARD, []);
  if (boardOn() && Array.isArray(cached)) ranks.rows = cached.filter((r) => r && typeof r.name === 'string' && r.score > 0);
  loadBoard().then((ok) => {
    if (ok && ui.overlay.dataset.view === 'menu' && game.mode === 'menu' && !ui.overlay.hidden) showMenu();
  });
  if (!restore(saved)) showMenu();
  if ('ResizeObserver' in window) new ResizeObserver(() => layout()).observe(stage);
  else window.addEventListener('resize', layout);
  last = performance.now();
  requestAnimationFrame(frame);
  // 웹(https)에 올렸을 때만: 한 번 열면 인터넷 없이도 실행되도록 저장
  if ('serviceWorker' in navigator && location.protocol === 'https:' && window.top === window) {
    navigator.serviceWorker.register('sw.js').catch(() => {
      /* 오프라인 저장 실패: 온라인에서는 그대로 동작 */
    });
  }
}

const hot = window.claude && window.claude.hot;
try {
  if (hot && typeof hot.snapshot === 'function') hot.snapshot(snapshot);
} catch (e) {
  /* 미지원 환경 */
}
if (hot && typeof hot.ready === 'function') hot.ready(start);
else start((hot && hot.data) || {});
</script>
