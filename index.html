<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>벽돌 철거반</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#d6d7d1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
  /* 레이아웃: 세로 한 화면. 위 현황판 → 가운데 경기장(벽) → 맨 아래 위험 띠.
     철거 현장 콘셉트: 콘크리트 바탕, 안전 노랑, 점토 벽돌, 쇠공, 수평계 모양 패들. */
  :root {
    --page: #d6d7d1;
    --field: #edf1f1;
    --ink: #1b1d20;
    --muted: #555958;
    --line: #b7b9b2;
    --safety: #f2c100;
    --safety-ink: #1b1d20;
    --cap: #25272b;
    --vial: #c9e39a;
    --bubble: #ffffff;
    --steel: #2b3037;
    --shine: rgba(255, 255, 255, 0.75);
    --mortar: #c3bfb5;
    --clay-1: #ad432c;
    --clay-2: #bf5739;
    --clay-3: #943a29;
    --clay-4: #a7583d;
    --clay-5: #c26b45;
    --clinker: #4a393d;
    --firebrick: #d6bd83;
    --brick-light: rgba(255, 255, 255, 0.2);
    --brick-shade: rgba(0, 0, 0, 0.18);
    --speck: rgba(84, 52, 22, 0.5);
    --crack-light: rgba(255, 255, 255, 0.6);
    --crack-dark: rgba(58, 30, 12, 0.65);
    --flash: #ffffff;
    --scrim: rgba(214, 215, 209, 0.84);
    --field-2: #dfe4e5;
    --steel-deep: #0c0e11;
    --safety-deep: #d49f00;
    --wall-shadow: rgba(20, 24, 30, 0.16);
    --board-shadow: 0 12px 32px rgba(20, 24, 30, 0.16);
    --good: #2a9765;
    --bad: #d8452f;
    --pole-s: #2f6fd8;
    --gold: #ffd24a;
    --st-sand: #dcbd8b;
    --st-granite: #aaa3a1;
    --st-obsid: #221f2b;
    --st-blast: #4d4845;
    --st-lode: #70757d;
    --st-jade: #3f9f78;
    --st-marble: #f1ede4;
    --st-quartz: #b792e6;
    --st-amber: #e39a2b;
    --st-gold: #5c5248;
    --st-meteor: #3d312d;
    --st-diamond: #c6eafb;
    --font-display: "Black Han Sans", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --font-body: "IBM Plex Sans KR", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #0e0f11;
      --field: #171a20;
      --ink: #eceef0;
      --muted: #9ba1a7;
      --line: #2e333b;
      --safety: #ffcb1f;
      --safety-ink: #15171a;
      --cap: #0b0c0e;
      --vial: #b4d67a;
      --steel: #d9dee4;
      --shine: rgba(255, 255, 255, 0.95);
      --mortar: #3a3938;
      --clay-1: #c4553b;
      --clay-2: #d36846;
      --clay-3: #ad4934;
      --clay-4: #bd684a;
      --clay-5: #d78158;
      --clinker: #6c585d;
      --firebrick: #dcc58f;
      --scrim: rgba(14, 15, 17, 0.84);
    --field-2: #101318;
    --steel-deep: #7f8791;
    --safety-deep: #e0a800;
    --wall-shadow: rgba(0, 0, 0, 0.4);
    --board-shadow: 0 14px 36px rgba(0, 0, 0, 0.5);
    --good: #4cc38a;
    --bad: #ff6a4d;
    --pole-s: #5b93f0;
    --st-obsid: #2f2a3a;
    --st-blast: #5b5551;
    --st-marble: #e4e0d6;
    --st-gold: #6a5f54;
    --st-meteor: #5a4840;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --page: #0e0f11;
    --field: #171a20;
    --ink: #eceef0;
    --muted: #9ba1a7;
    --line: #2e333b;
    --safety: #ffcb1f;
    --safety-ink: #15171a;
    --cap: #0b0c0e;
    --vial: #b4d67a;
    --steel: #d9dee4;
    --shine: rgba(255, 255, 255, 0.95);
    --mortar: #3a3938;
    --clay-1: #c4553b;
    --clay-2: #d36846;
    --clay-3: #ad4934;
    --clay-4: #bd684a;
    --clay-5: #d78158;
    --clinker: #6c585d;
    --firebrick: #dcc58f;
    --scrim: rgba(14, 15, 17, 0.84);
    --field-2: #101318;
    --steel-deep: #7f8791;
    --safety-deep: #e0a800;
    --wall-shadow: rgba(0, 0, 0, 0.4);
    --board-shadow: 0 14px 36px rgba(0, 0, 0, 0.5);
    --good: #4cc38a;
    --bad: #ff6a4d;
    --pole-s: #5b93f0;
    --st-obsid: #2f2a3a;
    --st-blast: #5b5551;
    --st-marble: #e4e0d6;
    --st-gold: #6a5f54;
    --st-meteor: #5a4840;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  html { background: var(--page); }
  body {
    background: var(--page);
    color: var(--ink);
    font-family: var(--font-body);
    font-synthesis: none;
    word-break: keep-all;
    overflow-wrap: anywhere;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  .app {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding-block: calc(10px + env(safe-area-inset-top, 0px)) calc(14px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    touch-action: none;
  }

  /* 현황판 */
  .hud {
    width: 100%;
    max-width: max(var(--board-w, 100%), 360px);
    display: flex;
    align-items: center;
    gap: 18px;
    min-height: 44px;
  }
  .stat { display: grid; gap: 3px; min-width: 0; }
  .stat-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: var(--muted);
  }
  .stat-value {
    font-family: var(--font-display);
    font-size: 22px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .lives { display: flex; align-items: center; gap: 5px; height: 22px; }
  .life {
    display: block;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 32%, var(--shine), var(--steel) 45%, var(--steel-deep));
  }
  .life.lost { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line); }
  .actions { margin-left: auto; display: flex; gap: 6px; }
  .icon-btn {
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    padding: 0;
    border: 1.5px solid var(--line);
    border-radius: 11px;
    background: transparent;
    color: var(--ink);
    cursor: pointer;
  }
  .icon-btn svg { width: 20px; height: 20px; display: block; }
  .icon-btn:active { background: var(--line); }
  .icon-btn:disabled { opacity: 0.35; cursor: default; }
  .icon-btn:focus-visible,
  .btn:focus-visible { outline: 3px solid var(--safety); outline-offset: 2px; }

  /* 경기장 */
  .stage {
    flex: 1;
    min-height: 0;
    width: 100%;
    display: grid;
    place-items: center;
  }
  .board {
    position: relative;
    width: 320px;
    height: 560px;
    border-radius: 14px;
    box-shadow: 0 0 0 1px var(--line), var(--board-shadow);
  }
  #game {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 14px;
    background: var(--field);
  }

  /* 공사 안내판 (시작 · 일시정지 · 게임 오버) */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    padding: 16px;
    border-radius: 14px;
    background: var(--scrim);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    overflow-y: auto;
    overscroll-behavior: contain;
    touch-action: pan-y;
  }
  .sign {
    margin: auto;
    width: 100%;
    max-width: 320px;
    background: var(--field);
    border: 1.5px solid var(--ink);
    border-radius: 12px;
    box-shadow: var(--board-shadow);
    overflow: hidden;
  }
  .sign-band {
    height: 12px;
    background: repeating-linear-gradient(-45deg, var(--safety) 0 10px, var(--cap) 10px 20px);
    border-bottom: 2px solid var(--ink);
  }
  .sign-body { display: grid; gap: 14px; padding: 18px 18px 20px; }
  .sign-eyebrow {
    margin: 0;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--muted);
  }
  .sign-title {
    margin: -4px 0 0;
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 34px;
    line-height: 1.15;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  .sign-text { margin: 0; font-size: 15px; line-height: 1.6; color: var(--muted); }
  .spec {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 8px 16px;
    margin: 0;
    padding-top: 12px;
    border-top: 1.5px dashed var(--line);
    font-size: 14px;
    line-height: 1.45;
  }
  .spec dt { color: var(--muted); font-weight: 600; white-space: nowrap; }
  .spec dd { margin: 0; min-width: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
  .sign-actions { display: grid; gap: 8px; margin-top: 2px; }
  .btn {
    min-height: 52px;
    padding: 0 18px;
    border-radius: 10px;
    font: inherit;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-primary {
    background: linear-gradient(var(--safety), var(--safety-deep));
    color: var(--safety-ink);
    border: 1.5px solid var(--cap);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45);
  }
  .btn-primary:active { transform: translateY(1px); }
  .btn-secondary { background: transparent; color: var(--ink); border: 2px solid var(--line); }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .lives-count { font-family: var(--font-display); font-size: 20px; line-height: 1; }

  /* 안내판 안의 추가 화면: 순위표 · 돌 도감 · 이름 입력 */
  .sign.wide { max-width: none; }
  .overlay:has(.sign.wide) { padding: 8px; }
  .sign.wide .sign-body { padding-inline: 8px; }
  .sign-custom { display: grid; gap: 10px; min-width: 0; }
  .sign-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 0 18px; margin-top: -6px; }
  .link-btn {
    min-height: 40px;
    padding: 0 6px;
    border: 0;
    background: none;
    color: var(--ink);
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
  }
  .link-btn:focus-visible { outline: 3px solid var(--safety); outline-offset: 2px; }
  .note { margin: 0; font-size: 14px; line-height: 1.55; color: var(--muted); }

  .board-list {
    margin: 0;
    padding: 0;
    list-style: none;
    max-height: min(46vh, 340px);
    overflow-y: auto;
    overscroll-behavior: contain;
    touch-action: pan-y;
    border-top: 1.5px dashed var(--line);
  }
  .board-row {
    display: grid;
    grid-template-columns: 24px minmax(0, 1fr) auto auto;
    align-items: baseline;
    gap: 8px;
    padding: 7px 6px;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
    line-height: 1.35;
    font-variant-numeric: tabular-nums;
  }
  .board-row .rank { color: var(--muted); font-weight: 700; text-align: right; }
  .board-row .who { min-width: 0; font-weight: 600; }
  .board-row .lv { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .board-row .pts { font-weight: 700; white-space: nowrap; }
  .board-row.mine { background: var(--safety); color: var(--safety-ink); border-radius: 6px; border-bottom-color: transparent; }
  .board-row.mine .rank, .board-row.mine .lv { color: inherit; }
  .board-row.gap { display: block; padding: 0; text-align: center; color: var(--muted); border-bottom: 0; }

  .codex {
    margin: 0;
    padding: 12px 0 0;
    list-style: none;
    display: grid;
    gap: 11px;
    max-height: min(52vh, 380px);
    overflow-y: auto;
    overscroll-behavior: contain;
    touch-action: pan-y;
    border-top: 1.5px dashed var(--line);
  }
  .codex li { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 1px 12px; font-size: 14px; line-height: 1.45; }
  .codex canvas { grid-row: span 2; width: 56px; height: 17px; margin-top: 3px; border-radius: 2px; box-shadow: 0 0 0 2px var(--mortar); }
  .codex b { font-weight: 700; }
  .codex small { margin-left: 6px; color: var(--muted); font-size: 12px; font-weight: 600; }
  .codex span { color: var(--muted); }

  .name-field {
    min-height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px 10px;
    border: 2px solid var(--ink);
    border-radius: 10px;
    background: var(--page);
    font-size: 21px;
    font-weight: 700;
    line-height: 1.2;
    white-space: pre-wrap;
    text-align: center;
  }
  .name-field .hint { color: var(--muted); font-size: 15px; font-weight: 400; }
  .caret { flex: none; width: 2px; height: 24px; margin-left: 2px; background: var(--ink); animation: blink 1s steps(2, start) infinite; }
  @keyframes blink { to { visibility: hidden; } }
  .keys { display: grid; gap: 6px; }
  .key-row { display: flex; justify-content: center; gap: 3px; }
  .key-row.inset { padding-inline: 5%; }
  .key {
    flex: 1 1 0;
    min-width: 0;
    height: 46px;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--page);
    color: var(--ink);
    font: inherit;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    touch-action: manipulation;
  }
  .key:active, .key.on { background: var(--safety); color: var(--safety-ink); border-color: var(--cap); }
  .key:focus-visible { outline: 3px solid var(--safety); outline-offset: 1px; }
  .key.fn { flex-grow: 1.5; font-size: 13px; }
  .key.space { flex-grow: 5; font-size: 13px; }
  @media (prefers-reduced-motion: reduce) {
    .caret { animation: none; }
  }

  @media (max-width: 360px) {
    .hud { gap: 12px; }
    .stat-value { font-size: 19px; }
    .icon-btn { width: 36px; height: 36px; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="hud" id="hud">
    <div class="stat">
      <span class="stat-label">점수</span>
      <span class="stat-value" id="hud-score">0</span>
    </div>
    <div class="stat">
      <span class="stat-label">레벨</span>
      <span class="stat-value" id="hud-level">1</span>
    </div>
    <div class="stat">
      <span class="stat-label">남은 공</span>
      <span class="lives" id="hud-lives" role="img" aria-label="남은 공 3개"></span>
    </div>
    <div class="actions">
      <button class="icon-btn" id="btn-sound" type="button" aria-label="소리 끄기"></button>
      <button class="icon-btn" id="btn-full" type="button" aria-label="전체 화면" hidden></button>
      <button class="icon-btn" id="btn-pause" type="button" aria-label="일시정지">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg>
      </button>
    </div>
  </header>
  <main class="stage" id="stage">
    <div class="board" id="board">
      <canvas id="game" role="img" aria-label="벽돌깨기 경기장"></canvas>
      <div class="overlay" id="overlay">
        <section class="sign" id="sign" role="dialog" aria-modal="true" aria-labelledby="sign-title">
          <div class="sign-band" aria-hidden="true"></div>
          <div class="sign-body">
            <p class="sign-eyebrow" id="sign-eyebrow">작업 안내</p>
            <h1 class="sign-title" id="sign-title">벽돌 철거반</h1>
            <p class="sign-text" id="sign-text">쇠공을 튕겨 벽을 모두 허물면 다음 벽이 나와요. 벽마다 실제 벽돌 쌓기 방식으로 지었어요.</p>
            <dl class="spec" id="sign-spec">
              <dt>조작</dt><dd>화면을 누른 채 좌우로 밀고, 손을 떼면 발사</dd>
              <dt>단단한 벽돌</dt><dd>클링커 2번, 내화벽돌 3번</dd>
            </dl>
            <div class="sign-custom" id="sign-custom" hidden></div>
            <div class="sign-actions">
              <button class="btn btn-primary" id="btn-primary" type="button">시작하기</button>
              <button class="btn btn-secondary" id="btn-secondary" type="button" hidden>처음부터</button>
            </div>
            <div class="sign-links" id="sign-links" hidden></div>
          </div>
        </section>
      </div>
    </div>
  </main>
</div>
<script>
'use strict';
document.documentElement.lang = 'ko';

/* ───────── 경기장 규격 (논리 좌표: 실제 화면 크기와 무관) ───────── */
const W = 400;                          // 경기장 너비
const MM = W / 1400;                    // 벽 너비 1400mm(벽돌 7장)를 경기장 너비에 맞춤
const BRICK_T = 57 * MM;                // 표준형 벽돌 높이 57mm
const JOINT = 10 * MM;                  // 줄눈 10mm
const COURSE = BRICK_T + JOINT;         // 벽돌 한 켜 높이
const WALL_TOP = 56;                    // 벽 위 빈 공간 (공이 넘어가서 튕기는 곳)
const PADDLE_H = 13;
const PADDLE_GAP = 52;                  // 패들과 바닥 사이 거리
const BALL_R = 7;
const START_LIVES = 3;
const STEP = 1 / 240;                   // 물리 계산 간격(초): 빠른 공도 벽돌을 뚫지 않게
const MAX_BOUNCE = (62 * Math.PI) / 180; // 패들 끝에 맞았을 때 최대 반사각
const KEY_SPEED = 560;
const KEY_BEST = 'brick-crew.best';
const KEY_MUTED = 'brick-crew.muted';
const KEY_NAME = 'brick-crew.name';
const KEY_BOARD = 'brick-crew.board';
const KEY_PENDING = 'brick-crew.pending';
const MAX_LIVES = 9;
const NAME_MAX = 24;                    // 순위표에 올리는 이름 길이 한도
const PULL_R = 150;                     // 자철석이 공을 끌어당기는 거리

// 순위표 서버 (Firebase Firestore). project가 비어 있으면 순위표 기능이 꺼짐
const BOARD = { project: 'brick-scores', top: 20 };

/* ───────── 레벨: 실제 벽돌 쌓기 방식 (단위 mm) ─────────
   pattern  S = 길이면(190mm), H = 마구리면(90mm), SH = 둘을 번갈아
   offset   그 켜를 왼쪽으로 미는 거리 (줄눈이 위아래로 엇갈리게)
   hp       1 = 일반 벽돌, 2 = 클링커 벽돌, 3 = 내화벽돌 */
const WALLS = [
  {
    name: '길이쌓기',
    tip: '표준형 벽돌 190×90×57mm로 쌓은 벽이에요.',
    courses: 4,
    course: (r) => ({ pattern: 'S', offset: r % 2 ? 100 : 0 }),
    hp: () => 1,
  },

const sound = {
  ctx: null,
  noiseBuf: null,
  muted: store.get(KEY_MUTED, '0') === '1',
  unlock() {
    if (this.muted) return;
    try {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ctx = new AC();
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) {
      this.ctx = null;
    }
  },
  live() {
    return !this.muted && !game.demo && this.ctx !== null && this.ctx.state === 'running';
  },
  tone(freq, dur, type, vol, endFreq = 0, delay = 0) {
    if (!this.live()) return;
    try {
      const c = this.ctx;
      const t = c.currentTime + delay;
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t);
      if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, t + dur);
      gain.gain.setValueAtTime(vol, t);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(gain);
      gain.connect(c.destination);
      osc.start(t);
      osc.stop(t + dur + 0.02);
    } catch (e) {
      /* 소리 없이 계속 */
    }
  },
  noise(dur, freq, vol) {
    if (!this.live()) return;
    try {
      const c = this.ctx;
      if (!this.noiseBuf) {
        const len = Math.floor(c.sampleRate * 0.25);
        this.noiseBuf = c.createBuffer(1, len, c.sampleRate);
        const data = this.noiseBuf.getChannelData(0);
        for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      }
      const t = c.currentTime;
      const src = c.createBufferSource();
      const filter = c.createBiquadFilter();
      const gain = c.createGain();
      src.buffer = this.noiseBuf;
      filter.type = 'bandpass';
      filter.frequency.value = freq;
      filter.Q.value = 1.1;
      gain.gain.setValueAtTime(vol, t);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(filter);
      filter.connect(gain);
      gain.connect(c.destination);
      src.start(t);
      src.stop(t + dur + 0.02);
    } catch (e) {
      /* 소리 없이 계속 */
    }
  },
  paddle() { this.tone(150, 0.1, 'triangle', 0.22); },

  const meta = document.querySelector('meta[name="theme-color"]');

function watchTheme() {
  const mq = matchMedia('(prefers-color-scheme: dark)');
  if (mq.addEventListener) mq.addEventListener('change', readPalette);
  else if (mq.addListener) mq.addListener(readPalette);
  new MutationObserver(readPalette).observe(document.documentElement, {
    attributes: true,
    attributeFilter: ['data-theme', 'class'],
  });
}

/* ───────── 화면 크기 맞추기: 가로 400 고정, 세로는 화면 비율에 맞춰 늘림 ───────── */
function layout() {
  const rect = stage.getBoundingClientRect();
  const aw = Math.max(200, rect.width);
  const ah = Math.max(260, rect.height);
  H = Math.round(clamp((W * ah) / aw, 560, 860));
  const scale = Math.min(aw / W, ah / H);
  const cssW = Math.floor(W * scale);
  const cssH = Math.floor(H * scale);
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  board.style.width = `${cssW}px`;
  board.style.height = `${cssH}px`;
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  document.documentElement.style.setProperty('--board-w', `${cssW}px`);
  paddle.y = H - PADDLE_GAP - PADDLE_H;
  if (ball.stuck) placeOnPaddle();
  render();
}

/* ───────── 벽 쌓기 ───────── */
function mulberry32(seed) {
  return function () {
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function layCourse(pattern, offset) {
  const seq = pattern === 'SH' ? [190, 90] : pattern === 'H' ? [90] : [190];
  const pieces = [];
  for (let x = -offset, i = 0; x < 1400; i++) {
    const len = seq[i % seq.length];
    const a = Math.max(0, x);
    const b = Math.min(1400, x + len);
    if (b > a) pieces.push({ a, b, header: len === 90 });
    x += len + 10;
  }
  // 양 끝의 좁은 조각은 옆 벽돌과 합쳐 한 장으로 (구석에 맞히기 힘든 조각 방지)
  const MIN = 60;
  if (pieces.length > 1 && pieces[0].b - pieces[0].a < MIN) {
    pieces[1].a = 0;
    pieces.shift();
  }
  const n = pieces.length;
  if (n > 1 && pieces[n - 1].b - pieces[n - 1].a < MIN) {
    pieces[n - 2].b = 1400;
    pieces.pop();
  }
  return pieces;
}

function cutOpening(pieces, from, to) {
  const out = [];
  for (const p of pieces) {
    if (p.b <= from || p.a >= to) {
      out.push(p);
      continue;
    }
    if (from - p.a >= 40) out.push({ a: p.a, b: from, header: p.header });
    if (p.b - to >= 40) out.push({ a: to, b: p.b, header: p.header });
  }
  return out;
}

function makeCrack(rand, k) {
  let x = k.x + k.w * (0.25 + rand() * 0.5);
  const pts = [[x, k.y]];
  for (let i = 1; i <= 3; i++) {
    x = clamp(x + (rand() - 0.5) * Math.min(14, k.w * 0.4), k.x + 2, k.x + k.w - 2);
    pts.push([x, k.y + (k.h * i) / 3]);
  }
  return pts;
}

/* ───────── 난이도 ─────────
   10레벨마다 한 단계씩 오름: 패들이 짧아지고, 단단한 벽돌이 늘고, 벽이 높아짐.
   공 속도는 단계와 상관없이 레벨마다 조금씩 계속 빨라짐 (speedFactor). */
const tierOf = (level) => Math.floor((level - 1) / 10);

function speedFactor(level) {
  const n = level - 1;
  // 초반엔 빨리, 뒤로 갈수록 천천히 오르되 멈추지는 않음. 상한은 공이 벽돌을 뚫지 않는 한계
  return Math.min(2.8, 1 + (1 - Math.exp(-n / 14)) + 0.005 * n);
}

function buildLevel(n) {
  const plan = WALLS[WALL_ORDER[(n - 1) % WALL_ORDER.length]];
  const tier = tierOf(n);
  const courses = plan.courses + Math.min(2, Math.floor(tier / 2));
  const toughChance = Math.min(0.5, tier * 0.1);
  const rand = mulberry32(n * 7919 + 17);
  const toughRand = mulberry32(n * 104729 + 3);
  bricks = [];
  for (let r = 0; r < courses; r++) {
    const { pattern, offset } = plan.course(r);
    let pieces = layCourse(pattern, offset);
    const op = plan.opening;
    if (op && r >= op.top && r <= op.bottom) pieces = cutOpening(pieces, op.from, op.to);
    if (plan.keep) pieces = pieces.filter((p, i) => plan.keep((p.a + p.b) / 2, r, courses, i));
    pieces.forEach((p, i) => {
      let hp = plan.hp(p, r, i);
      if (toughRand() < toughChance) hp = Math.min(3, hp + 1);
      const k = {
        x: p.a * MM,
        y: WALL_TOP + r * COURSE,
        w: (p.b - p.a) * MM,
        h: BRICK_T,
        hp,
        maxHp: hp,
        alive: true,
        flash: 0,
        tone: Math.floor(rand() * 5),
        kind: null, // 돌이면 STONES의 항목
      };
      if (hp > 1) k.cracks = [makeCrack(rand, k), makeCrack(rand, k)];
      if (hp > 2) k.specks = Array.from({ length: 5 }, () => [k.x + 2 + rand() * (k.w - 4), k.y + 2 + rand() * (k.h - 4)]);
      bricks.push(k);
    });
  }
  game.newStone = placeStones(n);
  game.lodes = bricks.filter((k) => k.kind && k.kind.pull);
  game.remaining = bricks.length;
  game.wallName = plan.name;
  if (game.newStone) game.wallTip = game.newStone.tip;
  else if (tier > 0 && (n - 1) % 10 === 0) game.wallTip = '패들이 짧아지고 단단한 벽돌이 늘어요.';
  else game.wallTip = n > WALLS.length ? '공이 조금씩 빨라지고 있어요.' : plan.tip;
  game.wallBottom = WALL_TOP + courses * COURSE;
  paddle.baseW = Math.max(54, 86 - tier * 8);
  paddle.w = paddle.baseW;
  paddle.target = clamp(paddle.target, paddle.w / 2, W - paddle.w / 2);
  paddle.x = paddle.target;
}

// 벽돌 몇 장을 돌로 바꿈. 이번 레벨에 처음 나온 돌이 있으면 그 돌을 돌려줌.
// 레벨 번호만으로 정해지므로 같은 레벨은 언제나 같은 벽이 됨 (이어하기 복원에 필요)
function placeStones(n) {
  const unlocked = STONES.filter((s) => s.from <= n);
  if (!unlocked.length) return null;
  const rand = mulberry32(n * 15485863 + 11);
  const newest = unlocked[unlocked.length - 1];
  const debut = newest.from === n ? newest : null;
  // 새로 나온 돌은 세 레벨 동안 꼭 넣고, 나머지는 레벨마다 바꿔 가며 모두 2~3종
  const picks = n - newest.from < 3 ? [newest] : [];
  const pool = unlocked.filter((s) => !picks.includes(s));
  const kinds = Math.min(unlocked.length, debut ? 2 : 3);
  while (picks.length < kinds && pool.length) picks.push(pool.splice(Math.floor(rand() * pool.length), 1)[0]);
  // 돌로 바꿀 자리: 일반 벽돌 가운데 고르되, 맞히기 힘든 벽 끝의 좁은 조각은 뺌
  const spots = bricks.filter((k) => k.maxHp === 1 && !(k.w < 40 && (k.x < 3 || k.x + k.w > W - 6)));
  let budget = Math.floor(bricks.length * 0.3);
  for (const s of picks) {
    let count = s === debut ? s.max : Math.max(1, Math.round(s.max * (0.5 + rand() * 0.5)));
    count = Math.min(count, budget, spots.length);
    budget -= count;
    for (let i = 0; i < count; i++) {
      // 아주 단단한 돌은 되도록 넓은 벽돌 자리에
      const wideSpots = s.hp >= 4 ? spots.filter((k) => k.w >= 50) : [];
      const from = wideSpots.length ? wideSpots : spots;
      const k = from[Math.floor(rand() * from.length)];
      spots.splice(spots.indexOf(k), 1);
      k.kind = s;
      k.hp = s.hp;
      k.maxHp = s.hp;
      k.specks = null;
      k.cracks = Array.from({ length: Math.min(4, s.hp - 1) }, () => makeCrack(rand, k));
      k.deco = Array.from({ length: 18 }, rand); // 무늬 위치 (돌마다 조금씩 다르게)
    }
  }
  return debut;
}

function brickColor(k) {
  if (k.kind) return colors.stone[k.kind.key];
  if (k.maxHp >= 3) return colors.firebrick;
  if (k.maxHp === 2) return colors.clinker;
  return colors.clay[k.tone % colors.clay.length];
}

/* ───────── 공 ───────── */
// 공 속도는 경기장 높이에 비례: 키 큰 화면에서도 패들↔벽 왕복 시간이 비슷하게
function baseSpeed() {
  return H * 0.44 * speedFactor(game.level);
}

function placeOnPaddle() {
  ball.x = paddle.x;
  ball.y = paddle.y - ball.r - 1;
}

function resetBall() {
  ball.speed = baseSpeed();
  ball.stuck = true;
  ball.vx = 0;
  ball.vy = 0;
  ball.trail.length = 0;
  game.dry = 0;
  clearFx();
  placeOnPaddle();
}

/* ───────── 돌의 일시 효과 ───────── */
const speedMul = () => (fx.fast > 0 ? 1.3 : 1) * (fx.slow > 0 ? 0.72 : 1);

function startFx(name, seconds) {
  const fresh = fx[name] <= 0;
  fx[name] = seconds;
  fxFull[name] = seconds;
  if (fresh && (name === 'fast' || name === 'slow') && !ball.stuck) setVelocity(ball.vx, ball.vy);
}

function clearFx() {
  for (const name of Object.keys(fx)) fx[name] = 0;
}

function tickFx(dt) {
  for (const name of Object.keys(fx)) {
    if (fx[name] <= 0) continue;
    fx[name] = Math.max(0, fx[name] - dt);
    if (fx[name] === 0 && (name === 'fast' || name === 'slow') && !ball.stuck) setVelocity(ball.vx, ball.vy);
  }
}

function launch() {
  if (!ball.stuck) return;
  const side = paddle.vx > 40 ? 1 : paddle.vx < -40 ? -1 : Math.random() < 0.5 ? -1 : 1;
  const angle = side * (0.2 + Math.random() * 0.35);
  ball.stuck = false;
  setVelocity(Math.sin(angle), -Math.cos(angle));
  game.mode = 'playing';
  game.acc = 0;
  sound.launch();
}

// 속도를 일정하게 유지하고, 너무 수평으로 흐르지 않게 막음
function setVelocity(vx, vy) {
  const s = ball.speed * speedMul();
  const len = Math.hypot(vx, vy) || 1;
  vx = (vx / len) * s;
  vy = (vy / len) * s;
  const minVy = s * 0.3;
  if (Math.abs(vy) < minVy) {
    vy = (vy < 0 ? -1 : 1) * minVy;
    vx = (vx < 0 ? -1 : 1) * Math.sqrt(s * s - vy * vy);
  }
  ball.vx = vx;
  ball.vy = vy;
}

function stepBall(dt) {
  ball.x += ball.vx * dt;
  ball.y += ball.vy * dt;

  if (ball.x < ball.r) {
    ball.x = ball.r;
    ball.vx = Math.abs(ball.vx);
    sound.wall();
  } else if (ball.x > W - ball.r) {
    ball.x = W - ball.r;
    ball.vx = -Math.abs(ball.vx);
    sound.wall();
  }
  if (ball.y < ball.r) {
    ball.y = ball.r;
    ball.vy = Math.abs(ball.vy);
    sound.wall();
  }

  pullBall(dt);
  if (ball.vy > 0) hitPaddle();
  hitBricks();
  if (game.remaining <= 0) levelClear();
  else if (game.mode === 'playing' && ball.y - ball.r > H) loseLife();
}

// 자철석: 가까이 지나가는 공의 방향을 돌 쪽으로 조금씩 꺾음 (속력은 그대로)
function pullBall(dt) {
  let ax = 0;
  let ay = 0;
  for (const k of game.lodes) {
    if (!k.alive) continue;
    const dx = k.x + k.w / 2 - ball.x;
    const dy = k.y + k.h / 2 - ball.y;
    const d = Math.hypot(dx, dy);
    if (d > PULL_R || d < 1) continue;
    const f = 1 - d / PULL_R; // 가까울수록 세게
    ax += (dx / d) * f;
    ay += (dy / d) * f;
  }
  if (!ax && !ay) return;
  const a = ball.speed * speedMul() * 6 * dt;
  let vy = ball.vy + ay * a;
  if (vy * ball.vy <= 0) vy = ball.vy; // 위아래 방향까지 뒤집지는 않음 (공이 돌 둘레를 맴돌지 않게)
  setVelocity(ball.vx + ax * a, vy);
}

function hitPaddle() {
  const left = paddle.x - paddle.w / 2;
  const dx = ball.x - clamp(ball.x, left, left + paddle.w);
  const dy = ball.y - clamp(ball.y, paddle.y, paddle.y + paddle.h);
  if (dx * dx + dy * dy > ball.r * ball.r) return;
  if (ball.y > paddle.y + paddle.h * 0.5) return; // 이미 패들 아래로 지나감
  // 패들 가운데에 맞으면 위로, 끝에 맞을수록 옆으로 비스듬히.
  // 벽돌을 못 깨고 왕복만 반복하면 각도를 조금씩 더 흔들어 같은 길만 도는 걸 막음
  game.dry += 1;
  const t = clamp((ball.x - paddle.x) / (paddle.w / 2), -1, 1);
  const jitter = (Math.random() - 0.5) * (0.06 + Math.min(0.4, game.dry * 0.03));
  const angle = clamp(t * MAX_BOUNCE + jitter, -MAX_BOUNCE, MAX_BOUNCE);
  ball.y = paddle.y - ball.r;
  setVelocity(Math.sin(angle), -Math.cos(angle));
  sound.paddle();
}

function hitBricks() {
  let hit = null;
  let best = Infinity;
  let hx = 0;
  let hy = 0;
  const r2 = ball.r * ball.r;
  for (const k of bricks) {
    if (!k.alive) continue;
    if (ball.x + ball.r < k.x || ball.x - ball.r > k.x + k.w) continue;
    if (ball.y + ball.r < k.y || ball.y - ball.r > k.y + k.h) continue;
    const dx = ball.x - clamp(ball.x, k.x, k.x + k.w);
    const dy = ball.y - clamp(ball.y, k.y, k.y + k.h);
    const d2 = dx * dx + dy * dy;
    if (d2 < r2 && d2 < best) {
      best = d2;
      hit = k;
      hx = dx;
      hy = dy;
    }
  }
  if (!hit) return;
  if (hit.kind && hit.kind.pierce) {
    // 무른 돌: 튕기지 않고 그대로 뚫고 지나감
    damageBrick(hit);
    return;
  }
  if (hx === 0 && hy === 0) {
    // 공 중심이 벽돌 안에 들어간 경우: 덜 파고든 쪽 면에 맞은 것으로 처리
    const penX = ball.vx > 0 ? ball.x - hit.x : hit.x + hit.w - ball.x;
    const penY = ball.vy > 0 ? ball.y - hit.y : hit.y + hit.h - ball.y;
    if (penX < penY && ball.vx !== 0) hx = ball.vx > 0 ? -1 : 1;
    else hy = ball.vy > 0 ? -1 : 1;
  }
  let bounced = false;
  if (Math.abs(hx) > Math.abs(hy)) {
    if (hx * ball.vx < 0) {
      ball.vx = -ball.vx;
      ball.x = hx > 0 ? hit.x + hit.w + ball.r : hit.x - ball.r;
      bounced = true;
    }
  } else if (hy * ball.vy < 0) {
    ball.vy = -ball.vy;
    ball.y = hy > 0 ? hit.y + hit.h + ball.r : hit.y - ball.r;
    bounced = true;
  }
  if (!bounced) return;
  if (hit.kind && hit.kind.scatter) {
    // 미끄러운 돌: 튕겨 나오는 각도를 20~46도 틀어 버림. 벽돌에서 멀어지는 방향은 유지
    const a = (Math.random() < 0.5 ? -1 : 1) * (0.35 + Math.random() * 0.45);
    let vx = ball.vx * Math.cos(a) - ball.vy * Math.sin(a);
    let vy = ball.vx * Math.sin(a) + ball.vy * Math.cos(a);
    if (Math.abs(hx) > Math.abs(hy)) {
      if (vx * hx <= 0) vx = -vx;
    } else if (vy * hy <= 0) vy = -vy;
    setVelocity(vx, vy);
  }
  damageBrick(hit);
}

// 벽돌(돌)에 피해 한 번. 벽을 다 허물었는지는 stepBall이 확인함
function damageBrick(k) {
  const s = k.kind;
  k.hp -= 1;
  game.dry = 0;
  addScore(s ? s.pts : 10);
  if (s && s.fast) {
    if (fx.fast <= 0) floater('빨라져요!', k, colors.bad);
    startFx('fast', s.fast);
    sound.zing();
  }
  if (s && s.slow) {
    if (fx.slow <= 0) floater('느려져요', k, colors.good);
    startFx('slow', s.slow);
    sound.blub();
  }
  if (k.hp > 0) {
    k.flash = 1;
    if (s) sound.clink();
    else sound.chip();
    return;
  }
  k.alive = false;
  game.remaining -= 1;
  burst(k, brickColor(k));
  sound.crumble();
  ball.speed = Math.min(ball.speed + 2.5, baseSpeed() * 1.35);
  if (!ball.stuck) setVelocity(ball.vx, ball.vy);
  if (!s) return;
  if (s.wide) {
    startFx('wide', s.wide);
    floater('긴 패들', k, colors.good);
    sound.chime();
  }
  if (s.double) {
    startFx('double', s.double);
    floater('점수 2배', k, colors.good);
    sound.chime();
  }
  if (s.life) gainLife(k);
  if (s.blast) explode(k);
}

// 발파석: 둘레(위아래 한 켜, 옆으로 한 장)에 있는 벽돌에 피해를 한 번씩. 옆의 발파석도 연달아 터짐
function explode(k) {
  const near = bricks.filter(
    (b) => b.alive && b.x < k.x + k.w + 30 && b.x + b.w > k.x - 30 && b.y < k.y + k.h + COURSE && b.y + b.h > k.y - COURSE,
  );
  game.shake = 0.3;
  sound.boom();
  buzz(30);
  if (!reduceMotion) {
    particles.push({ ring: true, big: true, x: k.x + k.w / 2, y: k.y + k.h / 2, life: 0, max: 0.45, color: colors.safety });
  }
  for (const b of near) if (b.alive) damageBrick(b);
}

function gainLife(k) {
  if (game.lives >= MAX_LIVES) {
    addScore(300);
    floater('+300', k, colors.good);
    return;
  }
  game.lives += 1;
  updateHud();
  floater('공 +1', k, colors.good);
  sound.chime();
}

// 벽돌 자리에서 떠오르는 짧은 글자
function floater(text, k, color) {
  particles.push({ text, x: clamp(k.x + k.w / 2, 40, W - 40), y: k.y + k.h / 2, life: 0, max: 1.1, color });
}

/* ───────── 파편 ───────── */
function burst(k, color) {
  const n = reduceMotion ? 4 : 10;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 50 + Math.random() * 170;
    particles.push({
      x: k.x + Math.random() * k.w,
      y: k.y + Math.random() * k.h,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 70,
      life: 0,
      max: 0.45 + Math.random() * 0.35,
      size: 2 + Math.random() * 3.5,
      rot: Math.random() * Math.PI,
      spin: (Math.random() - 0.5) * 14,
      color: i % 3 === 0 ? colors.mortar : color,
    });
  }
  if (!reduceMotion) {
    particles.push({ ring: true, x: k.x + k.w / 2, y: k.y + k.h / 2, life: 0, max: 0.32, color });
  }
  if (particles.length > 300) particles.splice(0, particles.length - 300);
}

function updateParticles(dt) {
  if (!particles.length) return;
  for (const p of particles) {
    p.life += dt;
    if (p.ring) continue;
    if (p.text) {
      p.y -= 26 * dt;
      continue;
    }
    p.rot += p.spin * dt;
    p.vy += 640 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
  }
  particles = particles.filter((p) => p.life < p.max);
}

/* ───────── 진행 ───────── */
function addScore(n) {
  game.score += fx.double > 0 ? n * 2 : n;
  if (!game.demo && game.score > game.best) game.best = game.score;
  updateHud();
}

function saveBest() {
  store.set(KEY_BEST, game.best);
}

function levelBanner(kicker = '') {
  const tier = tierOf(game.level);
  const tierUp = tier > 0 && (game.level - 1) % 10 === 0;
  const stone = tierUp ? null : game.newStone;
  game.banner = {
    kicker,
    badge: tierUp ? `난이도 ${tier + 1}단계` : stone ? `새 돌 · ${stone.name}` : '',
    stone, // 새 돌이 나온 레벨이면 딱지에 그 돌을 함께 그림
    title: `레벨 ${game.level}`,
    sub: tier > 0 && !tierUp ? `${game.wallName} · 난이도 ${tier + 1}단계` : game.wallName,
    tip: game.wallTip,
    t: 0,
    dur: tierUp || stone ? 3.6 : 2.6,
  };
}

function startGame() {
  sound.unlock();
  game.score = 0;
  game.lives = START_LIVES;
  game.level = 1;
  game.startBest = game.best;
  game.submitted = false;
  game.shake = 0;
  ranks.mine = null;
  particles = [];
  buildLevel(1);
  paddle.x = paddle.target = W / 2;
  resetBall();
  game.mode = 'ready';
  game.armed = false;
  hideOverlay();
  updateHud();
  levelBanner();
}

/* ───────── 데모: 시작 화면에서 가만히 두면 게임이 혼자 돌아가고, 순위표가 전광판처럼 흐름 ───────── */
const DEMO_WAIT = 8000; // 시작 화면에서 이만큼(ms) 아무 입력이 없으면 데모 시작
let lastInput = performance.now();

function demoWall() {
  // 여러 벽과 돌을 골고루 보여 주려고 레벨을 아무거나 고름
  game.level = 1 + Math.floor(Math.random() * 40);
  buildLevel(game.level);
  resetBall();
  game.mode = 'ready';
  game.demoWait = 0;
  game.demoWall = 0;
  updateHud();
}

function startDemo() {
  game.demo = true;
  game.demoT = 0;
  game.score = 0;
  game.lives = START_LIVES;
  game.banner = null;
  game.armed = false;
  particles = [];
  paddle.x = paddle.target = W / 2;
  hideOverlay();
  ui.pause.disabled = true;
  demoWall();
  loadBoard();
}

// 데모의 자동 조종: 사람처럼 조금 늦게 따라가고, 맞히는 위치를 계속 바꿈
function demoStep(dt) {
  game.demoT += dt;
  game.demoWall += dt;
  if (game.mode === 'ready') {
    game.demoWait += dt;
    if (game.demoWait > 0.9) launch();
  } else if (game.demoWall > 70) {
    demoWall(); // 한 벽에 너무 오래 머물지 않게
    return;
  }
  const aim = ball.x + Math.sin(game.demoT * 1.7) * paddle.w * 0.36;
  const reach = 640 * dt;
  paddle.target += clamp(aim - paddle.target, -reach, reach);
}

function levelClear() {
  if (game.demo) {
    demoWall();
    return;
  }
  addScore(100);
  saveBest();
  game.level += 1;
  // 10레벨을 깰 때마다 공 하나를 선물로 (이미 가득이면 점수로)
  let kicker = '벽 철거 완료 · 보너스 +100';
  if ((game.level - 1) % 10 === 0) {
    if (game.lives < MAX_LIVES) {
      game.lives += 1;
      kicker = `${game.level - 1}레벨 돌파 선물 · 공 +1`;
    } else {
      addScore(500);
      kicker = `${game.level - 1}레벨 돌파 선물 · 보너스 +500`;
    }
  }
  buildLevel(game.level);
  resetBall();
  game.mode = 'ready';
  game.armed = false;
  sound.clear();
  updateHud();
  levelBanner(kicker);
}

function loseLife() {
  if (game.demo) {
    // 데모에서는 공을 놓쳐도 그냥 다시 시작
    resetBall();
    game.mode = 'ready';
    game.demoWait = 0;
    return;
  }
  game.lives -= 1;
  sound.lose();
  buzz(80);
  updateHud();
  if (game.lives <= 0) {
    gameOver();
    return;
  }
  resetBall();
  game.mode = 'ready';
  game.armed = false;
  game.banner = { kicker: '', title: '놓쳤어요', sub: `남은 공 ${game.lives}개`, tip: '', t: 0, dur: 1.6 };
}

function gameOver() {
  game.mode = 'over';
  game.banner = null;
  game.submitted = false;
  ranks.mine = null;
  clearFx();
  saveBest();
  showOver();
  loadBoard(); // 순위표를 미리 받아 둠
}

// 게임 오버 안내판. 순위표나 이름 입력에서 돌아올 때도 씀
function showOver(note = '') {
  const record = game.score > game.startBest && game.score > 0;
  const canSubmit = boardOn() && game.score > 0 && !game.submitted;
  showOverlay({
    eyebrow: record ? '새 최고 기록' : `레벨 ${game.level} · ${game.wallName}`,
    title: '게임 오버',
    text: note,
    spec: [
      ['점수', `${fmt(game.score)}점`],
      ['내 최고 기록', `${fmt(game.best)}점`],
      ['도달 레벨', `${game.level}`],
    ],
    primary: canSubmit ? ['순위표에 기록 올리기', showNameEntry] : ['다시 하기', startGame],
    secondary: canSubmit ? ['다시 하기', startGame] : null,
    links: boardOn() ? [['순위표 보기', () => showBoard(() => showOver(note))]] : [],
  });
}

// 순위표 · 돌 도감으로 가는 작은 버튼들. back: 거기서 돌아올 화면
function viewLinks(back) {
  const links = [];
  if (boardOn()) links.push(['순위표', () => showBoard(back)]);
  links.push(['돌 도감', () => showCodex(back)]);
  return links;
}

function pause() {
  if (game.demo) return;
  if (game.mode !== 'playing' && game.mode !== 'ready') return;
  game.resumeMode = game.mode;
  game.mode = 'paused';
  game.armed = false;
  saveBest();
  showPaused();
}

function showPaused() {
  showOverlay({
    eyebrow: `레벨 ${game.level} · ${game.wallName}`,
    title: '일시정지',
    spec: [
      ['점수', `${fmt(game.score)}점`],
      ['남은 공', `${game.lives}개`],
    ],
    primary: ['계속하기', resume],
    secondary: ['처음부터', startGame],
    links: viewLinks(showPaused),
  });
}

function resume() {
  if (game.mode !== 'paused') return;
  sound.unlock();
  hideOverlay();
  game.mode = game.resumeMode;
  game.armed = false;
}

function showMenu() {
  if (game.demo) {
    // 데모를 끝내고 처음 상태로
    game.demo = false;
    game.score = 0;
    game.lives = START_LIVES;
    game.level = 1;
    game.banner = null;
    particles = [];
    buildLevel(1);
    paddle.x = paddle.target = W / 2;
    resetBall();
    updateHud();
  }
  lastInput = performance.now();
  game.mode = 'menu';
  const spec = [
    ['조작', game.touchUI ? '화면을 누른 채 좌우로 밀고, 손을 떼면 발사' : '마우스나 ← → 키로 이동, 클릭이나 스페이스로 발사'],
    ['단단한 벽돌', '클링커 2번, 내화벽돌 3번'],
    ['레벨', '4레벨마다 새 돌이 나오고, 10레벨마다 난이도가 오르고 공을 하나 받아요'],
  ];
  if (game.best > 0) spec.push(['내 최고 기록', `${fmt(game.best)}점`]);
  const top = ranks.rows[0];
  if (boardOn() && top) spec.push(['전체 1위', `${fmt(top.score)}점 · ${top.name}`]);
  showOverlay({
    view: 'menu',
    eyebrow: '작업 안내',
    title: '벽돌 철거반',

    spec,

}

/* ───────── 현황판 · 안내판 ───────── */
function updateHud() {
  ui.score.textContent = fmt(game.score);
  ui.level.textContent = String(game.level);
  if (shownLives !== game.lives) {
    shownLives = game.lives;
    const dots = [];
    if (game.lives > START_LIVES) {
      // 공이 많으면 자리가 모자라서 '● ×5'처럼 숫자로
      const d = document.createElement('i');
      const n = document.createElement('span');
      d.className = 'life';
      n.className = 'lives-count';
      n.textContent = `×${game.lives}`;
      dots.push(d, n);
    } else {
      for (let i = 0; i < START_LIVES; i++) {
        const d = document.createElement('i');
        d.className = i < game.lives ? 'life' : 'life lost';
        dots.push(d);
      }
    }
    ui.lives.replaceChildren(...dots);
    ui.lives.setAttribute('aria-label', `남은 공 ${game.lives}개`);
  }
}

function updateSoundButton() {
  ui.sound.innerHTML = sound.muted ? ICONS.soundOff : ICONS.soundOn;
  ui.sound.setAttribute('aria-label', sound.muted ? '소리 켜기' : '소리 끄기');
}

// view: 화면 이름 (비동기로 내용을 고칠 때 아직 그 화면인지 확인용)
// custom: 안내판 가운데에 넣을 요소들, links: 아래쪽 작은 버튼, back: Esc로 돌아갈 곳, wide: 판을 화면 폭까지 넓힘
function showOverlay({ view = '', eyebrow = '', title, text = '', spec = [], custom = [], primary, secondary = null, links = [], back = null, wide = false }) {
  ui.overlay.dataset.view = view;
  nameEntry.active = view === 'name';
  ui.sign.classList.toggle('wide', wide);
  ui.custom.replaceChildren(...custom);
  ui.custom.hidden = custom.length === 0;
  ui.links.replaceChildren(
    ...links.map(([label, action]) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'link-btn';
      b.textContent = label;
      b.addEventListener('click', action);
      return b;
    }),
  );
  ui.links.hidden = links.length === 0;
  overlayActions.back = back;
  ui.primary.disabled = false;
  ui.secondary.disabled = false;
  ui.eyebrow.textContent = eyebrow;
  ui.eyebrow.hidden = !eyebrow;
  ui.title.textContent = title;
  ui.text.textContent = text;
  ui.text.hidden = !text;
  const rows = [];
  for (const [term, desc] of spec) {
    const dt = document.createElement('dt');
    const dd = document.createElement('dd');
    dt.textContent = term;
    dd.textContent = desc;
    rows.push(dt, dd);
  }
  ui.spec.replaceChildren(...rows);
  ui.spec.hidden = rows.length === 0;
  ui.primary.textContent = primary[0];
  overlayActions.primary = primary[1];
  ui.secondary.hidden = !secondary;
  overlayActions.secondary = secondary ? secondary[1] : null;
  if (secondary) ui.secondary.textContent = secondary[0];
  ui.overlay.hidden = false;
  ui.pause.disabled = true;
  keys.left = false;
  keys.right = false;
  needsRender = true;
  ui.overlay.scrollTop = 0;
  if (lastKeyboard && view !== 'name') ui.primary.focus({ preventScroll: true });
}

function hideOverlay() {
  nameEntry.active = false;
  ui.overlay.hidden = true;
  ui.pause.disabled = false;
  const active = document.activeElement;
  if (active && active !== document.body && typeof active.blur === 'function') active.blur();
}

/* ───────── 순위표: 점수를 서버(Firebase Firestore)에 저장하고 불러옴 ─────────
   서버에는 기록마다 이름·점수·레벨만 저장함. 받는 형식은 firestore.rules가 검사함 */
const ranks = {
  rows: [], // 상위 기록 [{ id, name, score, level, at }]
  at: 0, // 마지막으로 받아 온 시각
  state: 'idle', // idle | loading | ok | error
  busy: null, // 받아 오는 중인 요청
  flushing: false,
  mine: null, // 이번 판에 올린 내 기록 { id, name, score, level, rank }
};
const boardOn = () => BOARD.project !== '';

function readJson(key, fallback) {
  try {
    const v = JSON.parse(store.get(key, 'null'));
    return v === null ? fallback : v;
  } catch (e) {
    return fallback;
  }
}

async function boardCall(path, body) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 9000);
  try {
    const res = await fetch(`https://firestore.googleapis.com/v1/projects/${BOARD.project}/databases/(default)/documents${path}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      signal: ctrl.signal,
    });
    if (!res.ok) {
      const err = new Error(`HTTP ${res.status}`);
      err.status = res.status;
      throw err;
    }
    return await res.json();
  } finally {
    clearTimeout(timer);
  }
}

// 서버가 받아 주지 않을 기록인지 (형식이 틀림). 이런 기록은 다시 보내도 소용없음
const refused = (err) => err.status >= 400 && err.status < 500 && err.status !== 429;

function rowOf(doc) {
  const f = doc.fields || {};
  return {
    id: String(doc.name || '').split('/').pop(),
    name: String((f.name && f.name.stringValue) || '').slice(0, NAME_MAX),
    score: Number(f.score && f.score.integerValue) || 0,
    level: Number(f.level && f.level.integerValue) || 1,
    at: doc.createTime || '',
  };
}

function loadBoard(force = false) {
  if (!boardOn()) return Promise.resolve(false);
  if (ranks.busy) return ranks.busy;
  if (!force && ranks.state === 'ok' && Date.now() - ranks.at < 30000) return Promise.resolve(true);
  ranks.state = 'loading';
  ranks.busy = boardCall(':runQuery', {
    structuredQuery: {
      from: [{ collectionId: 'scores' }],
      orderBy: [{ field: { fieldPath: 'score' }, direction: 'DESCENDING' }],
      limit: BOARD.top,
    },
  })
    .then((res) => {
      // 점수가 같으면 먼저 올린 기록이 위
      ranks.rows = (Array.isArray(res) ? res : [])
        .filter((r) => r.document)
        .map((r) => rowOf(r.document))
        .sort((a, b) => b.score - a.score || (a.at < b.at ? -1 : 1));
      ranks.at = Date.now();
      ranks.state = 'ok';
      store.set(KEY_BOARD, JSON.stringify(ranks.rows));
      needsRender = true;
      return true;
    })
    .catch(() => {
      ranks.state = 'error';
      return false;
    })
    .finally(() => {
      ranks.busy = null;
    });
  ranks.busy.then((ok) => {
    if (ok) flushPending();
  });
  return ranks.busy;
}

function postScore(entry) {
  return boardCall('/scores', {
    fields: {
      name: { stringValue: entry.name },
      score: { integerValue: String(entry.score) },
      level: { integerValue: String(entry.level) },
    },
  }).then(rowOf);
}

// 내 점수보다 높은 기록의 수 + 1
function fetchRank(score) {
  return boardCall(':runAggregationQuery', {
    structuredAggregationQuery: {
      structuredQuery: {
        from: [{ collectionId: 'scores' }],
        where: { fieldFilter: { field: { fieldPath: 'score' }, op: 'GREATER_THAN', value: { integerValue: String(score) } } },
      },
      aggregations: [{ alias: 'n', count: {} }],
    },
  }).then((res) => Number(res[0].result.aggregateFields.n.integerValue) + 1);
}

// 인터넷이 안 될 때 올리지 못한 기록은 보관해 두었다가 다음에 연결되면 올림
function queuePending(entry) {
  const list = readJson(KEY_PENDING, []);
  store.set(KEY_PENDING, JSON.stringify([...(Array.isArray(list) ? list : []), entry].slice(-5)));
}

async function flushPending() {
  const saved = readJson(KEY_PENDING, []);
  const list = Array.isArray(saved) ? saved : [];
  if (ranks.flushing || !list.length) return;
  ranks.flushing = true;
  let sent = 0;
  try {
    while (list.length) {
      const e = list[0] || {};
      const entry = { name: cleanName(e.name || ''), score: e.score | 0, level: e.level | 0 };
      try {
        if (nameOk(entry.name) && entry.score > 0) {
          await postScore(entry);
          sent += 1;
        }
      } catch (err) {
        if (!refused(err)) break; // 아직 연결이 안 됨: 다음에 다시
      }
      list.shift();
      store.set(KEY_PENDING, JSON.stringify(list));
    }
  } finally {
    ranks.flushing = false;
  }
  if (sent) {
    ranks.at = 0;
    loadBoard(true);
  }
}

function note(text) {
  const p = document.createElement('p');
  p.className = 'note';
  p.textContent = text;
  return p;
}

function boardRow(rank, r, mine) {
  const li = document.createElement('li');
  li.className = mine ? 'board-row mine' : 'board-row';
  const cells = [
    ['rank', String(rank)],
    ['who', r.name],
    ['lv', `레벨 ${r.level}`],
    ['pts', `${fmt(r.score)}점`],
  ];
  for (const [cls, text] of cells) {
    const span = document.createElement('span');
    span.className = cls;
    span.textContent = text; // 이름은 남이 적은 글자라 반드시 글자로만 넣음
    li.append(span);
  }
  return li;
}

function boardNodes() {
  if (!ranks.rows.length) {
    if (ranks.state === 'loading' || ranks.state === 'idle') return [note('순위를 불러오는 중이에요…')];
    if (ranks.state === 'error') return [note('순위를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.')];
    return [note('아직 기록이 없어요. 첫 기록을 남겨 보세요.')];
  }
  const list = document.createElement('ol');
  list.className = 'board-list';
  const mine = ranks.mine;
  let found = false;
  ranks.rows.forEach((r, i) => {
    const isMine = !!mine && r.id === mine.id;
    found = found || isMine;
    list.append(boardRow(i + 1, r, isMine));
  });
  if (mine && !found) {
    const gap = document.createElement('li');
    gap.className = 'board-row gap';
    gap.textContent = '⋮';
    list.append(gap, boardRow(mine.rank || '–', mine, true));
  }
  const out = [list];
  if (ranks.state === 'error') out.push(note('인터넷에 연결되지 않아 마지막으로 받은 순위를 보여 드려요.'));
  return out;
}

// again: 기록을 막 올린 뒤라 '다시 하기'를 큰 버튼으로
function showBoard(back, again = false) {
  const paint = () => {
    if (ui.overlay.dataset.view !== 'board' || ui.overlay.hidden) return;
    ui.custom.replaceChildren(...boardNodes());
    const mine = ui.custom.querySelector('.mine');
    if (mine) mine.scrollIntoView({ block: 'nearest' });
  };
  showOverlay({
    view: 'board',
    eyebrow: `상위 ${BOARD.top}개 기록`,
    title: '순위표',
    custom: boardNodes(),
    primary: again ? ['다시 하기', startGame] : ['돌아가기', back],
    secondary: again ? ['닫기', back] : null,
    back,
  });
  paint();
  loadBoard(!again).then(paint);
}
